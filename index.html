<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bujo</title>
<meta name="description" content="Bullet journal personal: registro diario, trackers y backup local.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bujo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: una columna tipo libreta (máx. 560px), cabecera fija con la fecha al estilo del cuaderno, secciones plegables con títulos espaciados. */
:root{
  --paper:#F3F4F1; --dot:#D3D6DD; --card:#FFFFFF; --card2:#F7F8F6;
  --ink:#1D2230; --muted:#6B7080; --line:#E2E4E8;
  --accent:#2C47B8; --accent-ink:#FFFFFF; --accent-soft:#E6EAFA;
  --red:#C9372C; --red-soft:#FBE7E5; --amber:#B7791F; --amber-soft:#FBF1DE; --green:#2F8A57; --green-soft:#E1F3E8;
  --s0:#C9372C; --s1:#E0663A; --s2:#E3A13A; --s3:#B9B23D; --s4:#6DAA4E; --s5:#2F8A57;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 2px 8px rgba(20,25,40,.04);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --tap:44px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121419; --dot:#262A33; --card:#1B1E25; --card2:#20242C;
  --ink:#E8EAF0; --muted:#9097A8; --line:#2C313B;
  --accent:#8EA2FF; --accent-ink:#0F1220; --accent-soft:#252C4A;
  --red:#FF7A6E; --red-soft:#3A2020; --amber:#E7B45A; --amber-soft:#3A2F1C; --green:#6FD39A; --green-soft:#1D3328;
  --s0:#E8574B; --s1:#EE7A4E; --s2:#E9B04E; --s3:#C9C356; --s4:#83C066; --s5:#4FB57C;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#121419; --dot:#262A33; --card:#1B1E25; --card2:#20242C;
  --ink:#E8EAF0; --muted:#9097A8; --line:#2C313B;
  --accent:#8EA2FF; --accent-ink:#0F1220; --accent-soft:#252C4A;
  --red:#FF7A6E; --red-soft:#3A2020; --amber:#E7B45A; --amber-soft:#3A2F1C; --green:#6FD39A; --green-soft:#1D3328;
  --s0:#E8574B; --s1:#EE7A4E; --s2:#E9B04E; --s3:#C9C356; --s4:#83C066; --s5:#4FB57C;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.4 var(--f-ui);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px;background-attachment:fixed;
  min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:8px 16px 10px}
.toprow{display:flex;align-items:center;gap:8px;min-height:44px}
.datebtn{flex:1;min-width:0;text-align:left;position:relative;display:flex;align-items:baseline;gap:10px;min-height:44px}
.datebtn .d{font:600 22px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.datebtn .w{font:600 13px/1 var(--f-ui);letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--card2)}
.iconbtn svg{width:22px;height:22px}
.saved{font-size:12px;color:var(--green);opacity:0;transition:opacity .3s;white-space:nowrap}
.saved.on{opacity:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px;align-items:stretch}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 6px;border-radius:10px;min-height:52px}
.wd .l{font-size:11px;color:var(--muted);letter-spacing:.08em}
.wd .n{font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums}
.wd .c{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);opacity:.6}
.wd .c.cp{border-color:var(--amber);background:linear-gradient(90deg,var(--amber) 50%,transparent 50%);opacity:1}
.wd .c.cf{border-color:var(--green);background:var(--green);opacity:1}
.wd.sel{background:var(--accent);color:var(--accent-ink)}
.wd.sel .l{color:var(--accent-ink);opacity:.8}
.wd.today:not(.sel) .n{color:var(--accent)}
.wd.future{opacity:.45}
.weeknav{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.weeknav button{font-size:13px;color:var(--accent);min-height:32px;padding:0 4px}
.todaylink{font-weight:600}

/* Banners */
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-top:12px;font-size:14px}
.banner .t{flex:1;min-width:0}
.banner button{font-weight:600;min-height:36px;padding:0 10px;border-radius:10px}
.b-demo{background:var(--amber-soft);color:var(--amber)}
.b-demo button{background:var(--amber);color:var(--card)}
.b-warn{background:var(--red-soft);color:var(--red)}
.b-warn button{background:var(--red);color:var(--card)}
.b-info{background:var(--accent-soft);color:var(--accent)}
.b-info button{background:var(--accent);color:var(--accent-ink)}

/* Sections */
.sec{margin-top:22px}
.sech{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;text-align:left}
.sech h2{margin:0;font:600 12px/1 var(--f-ui);letter-spacing:.34em;text-transform:uppercase;color:var(--ink);flex:1}
.sech .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sech .chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .secb{display:none}
.secb{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.secb.grid2{display:grid;grid-template-columns:1fr 1fr}
.secb.grid2 .trk .counter{gap:6px;justify-content:space-between}
.secb.grid2 .trk .cval{min-width:32px}
.secb.grid2 .cunit,.secb.grid2 .aux{display:none}
.card{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.trk .hd{display:flex;align-items:center;gap:8px;min-height:28px}
.trk .nm{font-weight:600;font-size:15px;flex:1;min-width:0}
.trk .rec{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.trk.done .rec{background:var(--green)}
.trk .aux{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.trk .bd{margin-top:8px;display:flex;flex-direction:column;gap:10px}
.clear{font-size:12px;color:var(--muted);min-height:28px;padding:0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--muted);min-width:0}

/* Scale */
.scale{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.sc{min-height:var(--tap);border-radius:11px;background:var(--card2);border:1px solid var(--line);font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums;display:grid;place-items:center;position:relative}
.sc.on{color:#15171C;border-color:transparent}
.sc .sw{position:absolute;left:8px;right:8px;bottom:5px;height:3px;border-radius:2px;opacity:.9}
.sc.on .sw{display:none}
.face svg{width:28px;height:28px}
.sc.face.on{background:var(--accent);color:var(--accent-ink)}

/* Segmented, chips */
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:15px;font-weight:500;white-space:nowrap;padding:0 8px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent);font-weight:600}
:root[data-theme="dark"] .seg button.on{background:var(--accent-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:var(--accent-soft)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 13px;border-radius:19px;background:var(--card2);border:1px solid var(--line);font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.chip.sm{min-height:32px;font-size:14px;padding:0 10px}
.chip .x{opacity:.6;font-size:16px;margin-left:2px}
.chip .cdot{width:7px;height:7px;border-radius:50%;background:var(--amber)}

/* Counter */
.counter{display:flex;align-items:center;gap:10px}
.cbtn{width:var(--tap);height:var(--tap);border-radius:12px;background:var(--card2);border:1px solid var(--line);font:500 24px/1 var(--f-display);display:grid;place-items:center}
.cbtn.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cval{min-width:48px;text-align:center;font:600 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.cval.nil{color:var(--muted)}
.cunit{font-size:13px;color:var(--muted)}
.glass{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.glass i{width:10px;height:16px;border-radius:2px 2px 4px 4px;border:1.5px solid var(--accent);opacity:.5}
.glass i.f{background:var(--accent);opacity:1}
.goal{font-size:12px;font-weight:600;color:var(--green);background:var(--green-soft);padding:3px 8px;border-radius:8px}

/* Inputs */
.inp{min-height:var(--tap);border-radius:11px;border:1px solid var(--line);background:var(--card2);padding:0 12px;font-size:16px;width:100%;min-width:0}
textarea.inp{padding:10px 12px;min-height:72px;resize:vertical;line-height:1.4}
input[type=time].inp,input[type=date].inp,input[type=month].inp{font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;display:flex;align-items:center}
.tfield{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.sleepgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hours{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.hours b{font:600 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.link{color:var(--accent);font-size:14px;font-weight:500;min-height:32px;padding:0 2px}

/* Tag input */
.tagin{display:flex;flex-direction:column;gap:6px}
.tagin .row{flex-wrap:nowrap}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{flex:none}
.meal{display:flex;flex-direction:column;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:0}
.meal .mh{display:flex;align-items:center;gap:8px}
.meal .mn{font:600 12px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;flex:1}
.addbtn{min-height:var(--tap);min-width:var(--tap);border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 12px;flex:none}

/* Bristol */
.bgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.bb{min-height:56px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 13px/1 var(--f-display)}
.bb svg{width:26px;height:18px}
.blist{display:flex;flex-direction:column;gap:6px}
.bent{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:6px 8px;border:1px solid var(--line)}
.bent .bt{font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center}
.bent svg{width:26px;height:18px}
.bent .bd2{font-size:13px;color:var(--muted);flex:1;min-width:0}
.bent input{width:96px;min-height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);padding:0 6px}
.bc-a{color:var(--amber)} .bc-g{color:var(--green)} .bc-r{color:var(--red)}

/* Rapid log */
.log{display:flex;flex-direction:column}
.li{display:flex;align-items:flex-start;gap:4px;min-height:var(--tap);border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.bul{width:40px;height:var(--tap);display:grid;place-items:center;flex:none;font:600 20px/1 var(--f-display);color:var(--ink)}
.li .tx{flex:1;min-width:0;padding:11px 0;text-align:left;word-break:break-word}
.li.done .tx{color:var(--muted)}
.li.cancel .tx{text-decoration:line-through;color:var(--muted)}
.li.mig{opacity:.55}
.li .tm{font:500 13px/1 var(--f-mono);color:var(--muted);padding:15px 4px 0}
.person{color:var(--accent);font-weight:600}
.logadd{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.sugbar{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:6px 6px 6px 10px;font-size:14px}
.sugbar .t{flex:1;min-width:0}
.sugbar button{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:8px;min-height:34px;padding:0 10px}
.cycleinfo{font-size:13px;color:var(--muted)}
.cycleinfo b{color:var(--ink);font-weight:600}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.42);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--paper);border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.on{transform:none}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 18px;border-bottom:1px solid var(--line);max-width:560px;width:100%;margin:0 auto}
.sheet .sh h3{flex:1;margin:0;font:600 17px/1.2 var(--f-ui)}
.sheet .sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.full{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.full .top{position:sticky}
.btn{min-height:var(--tap);border-radius:12px;padding:0 16px;font-weight:600;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dan{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.dan.fill{background:var(--red);color:var(--paper);border-color:var(--red)}
.btn.blk{width:100%}
.btn:disabled{opacity:.45}
.group{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.gi{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.gi:first-child{border-top:0}
.gi .k{flex:1;min-width:0}
.gi .k small{display:block;color:var(--muted);font-size:13px}
.gi .v{color:var(--muted);font-size:14px;text-align:right}
.gh{font:600 12px/1 var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:14px 4px 0}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0 4px}
.warnbox{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.okbox{background:var(--green-soft);color:var(--green);border-radius:12px;padding:10px 12px;font-size:14px}
.sw-t{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw-t::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw-t.on{background:var(--green)}
.sw-t.on::after{transform:translateX(20px)}
.mini{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.mini:disabled{opacity:.3}
.mini svg{width:18px;height:18px}
.arch{opacity:.5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}

/* Lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.lock h1{font:600 13px/1 var(--f-ui);letter-spacing:.4em;text-transform:uppercase;margin:0}
.pins{display:flex;gap:14px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pins i.f{background:var(--ink)}
.pins.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--card);border:1px solid var(--line);font:500 28px/1 var(--f-display)}
.pad button:active{background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:200;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.fatal{margin:40px 16px;padding:16px;border-radius:12px;background:var(--red-soft);color:var(--red)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   Bujo · v0.1.0 (fase 1a)
   Esquema de datos v1. Cambios de esquema => nueva entrada en MIGRATIONS.
   ===================================================================== */
const APP_VERSION = '0.1.0';
const SCHEMA_VERSION = 1;
const IDB_VERSION = 1;
const DB_REAL = 'bujo', DB_DEMO = 'bujo_demo';
const TZ = 'Europe/Madrid';
const STORES = ['meta','trackers','entries','events','tags','items','people'];

/* ---------------- utilidades ---------------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, a, ...kids) {
  const el = document.createElement(tag);
  if (a) for (const k in a) {
    const v = a[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k in el && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}

function idbReq(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
class IDBAdapter {
  constructor(name) { this.name = name; this.kind = 'idb'; }
  open() {
    return new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open(this.name, IDB_VERSION); } catch (e) { return rej(e); }
      r.onupgradeneeded = e => {
        const db = r.result, old = e.oldVersion;
        // Migraciones estructurales de IndexedDB: añadir casos, nunca borrar stores con datos.
        if (old < 1) {
          db.createObjectStore('meta', { keyPath: 'key' });
          db.createObjectStore('trackers', { keyPath: 'id' });
          const en = db.createObjectStore('entries', { keyPath: ['date', 'trackerId'] });
          en.createIndex('date', 'date'); en.createIndex('trackerId', 'trackerId');
          const ev = db.createObjectStore('events', { keyPath: 'id' });
          ev.createIndex('date', 'date'); ev.createIndex('trackerId', 'trackerId');
          const tg = db.createObjectStore('tags', { keyPath: 'id' });
          tg.createIndex('norm', 'norm');
          const it = db.createObjectStore('items', { keyPath: 'id' });
          it.createIndex('date', 'date'); it.createIndex('collection', 'collection');
          it.createIndex('trail', 'trail', { multiEntry: true });
          const pp = db.createObjectStore('people', { keyPath: 'id' });
          pp.createIndex('norm', 'norm');
        }
      };
      r.onblocked = () => rej(new Error('La base de datos está bloqueada por otra pestaña.'));
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => { this.db.close(); location.reload(); }; res(this); };
      r.onerror = () => rej(r.error);
    });
  }
  st(store, mode = 'readonly') { return this.db.transaction(store, mode).objectStore(store); }
  get(s, k) { return idbReq(this.st(s).get(k)); }
  all(s) { return idbReq(this.st(s).getAll()); }
  byIndex(s, i, q) { return idbReq(this.st(s).index(i).getAll(q)); }
  put(s, v) { return idbReq(this.st(s, 'readwrite').put(v)); }
  del(s, k) { return idbReq(this.st(s, 'readwrite').delete(k)); }
  putMany(s, arr) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(s, 'readwrite'), os = tx.objectStore(s);
      arr.forEach(v => os.put(v)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  }
  replaceAll(data) {

      const tx = this.db.transaction(STORES, 'readwrite');
      for (const s of STORES) { const os = tx.objectStore(s); os.clear(); (data[s] || []).forEach(v => os.put(v)); }

    });

}
/* Respaldo en memoria si IndexedDB no está disponible (p. ej. navegación privada). Se avisa en pantalla. */
class MemAdapter {
  constructor() { this.kind = 'mem'; this.s = {}; STORES.forEach(n => this.s[n] = new Map()); }
  key(s, v) { return s === 'entries' ? v.date + '|' + v.trackerId : s === 'meta' ? v.key : v.id; }
  async open() { return this; }
  async get(s, k) { return clone(this.s[s].get(Array.isArray(k) ? k.join('|') : k) ?? null) || undefined; }
  async all(s) { return clone([...this.s[s].values()]); }
  async byIndex(s, i, q) { return clone([...this.s[s].values()].filter(v => Array.isArray(v[i]) ? v[i].includes(q) : v[i] === q)); }
  async put(s, v) { this.s[s].set(this.key(s, v), clone(v)); }
  async del(s, k) { this.s[s].delete(Array.isArray(k) ? k.join('|') : k); }
  async putMany(s, arr) { arr.forEach(v => this.put(s, v)); }
  async replaceAll(data) { STORES.forEach(n => { this.s[n].clear(); (data[n] || []).forEach(v => this.put(n, v)); }); }
  close() {}
}

async function loadCycle() {
  const t = S.trackers.find(x => x.type === 'cycle' && !x.archived);
  if (!t) { S.cycle = []; return; }
  const en = await S.db.byIndex('entries', 'trackerId', t.id);
  S.cycle = en.filter(e => e.value?.period).map(e => e.date).sort();
  S.cycleNo = new Set(en.filter(e => e.value?.period === false).map(e => e.date));
}
function cycleInfo(date) {
  const days = S.cycle; if (!days.length) return null;
  const set = new Set(days);
  const starts = days.filter(d => !set.has(addDays(d, -1)));
  const prev = starts.filter(s => s <= date); if (!prev.length) return null;
  const start = prev[prev.length - 1];
  const lens = []; for (let i = 1; i < starts.length; i++) { const l = diffDays(starts[i], starts[i - 1]); if (l >= 18 && l <= 60) lens.push(l); }
  const L = lens.length ? Math.round(lens.slice(-6).reduce((a, b) => a + b, 0) / Math.min(lens.length, 6)) : 28;
  const day = diffDays(date, start) + 1;
  let bleed = 0; while (set.has(addDays(start, bleed))) bleed++;
  const ov = L - 14;
  let phase;
  if (day <= Math.max(bleed, 1) || (day <= 5 && !S.cycleNo?.has(date) && ![...Array(day - 1).keys()].some(k => S.cycleNo?.has(addDays(start, k + 1))))) phase = 'menstrual';
  else if (day < ov - 1) phase = 'folicular';
  else if (day <= ov + 1) phase = 'ovulatoria';
  else phase = 'lútea';
  return { day, phase, L, estimated: !lens.length, late: day > L + 7 };
}

function findTag(name) {
  const n = norm(name);
  for (const t of S.tags.values()) if (t.norm === n || (t.aliases || []).some(a => norm(a) === n)) return t;
  return null;
}
async function ensureTag(name) {
  const clean = name.replace(/\s+/g, ' ').trim(); if (!clean) return null;
  let t = findTag(clean);
  if (!t) { t = { id: uid(), name: clean, norm: norm(clean), categories: [], aliases: [], created: nowISO() }; await S.db.put('tags', t); S.tags.set(t.id, t); }
  return t;
}
function tagSuggestions(q, exclude = []) {
  const n = norm(q); if (!n) return [];
  const res = [];
  for (const t of S.tags.values()) {
    if (exclude.includes(t.id)) continue;
    const hit = t.norm.startsWith(n) ? 0 : t.norm.includes(n) ? 1 : (t.aliases || []).some(a => norm(a).includes(n)) ? 2 : -1;
    if (hit >= 0) res.push([hit, t]);
  }
  return res.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).slice(0, 8).map(x => x[1]);
}

  const ids = [];
  for (const m of text.matchAll(PERSON_RE)) {
    const raw = m[1].replace(/[.\-]+$/, ''); const n = norm(raw.replace(/_/g, ' '));
    let p = [...S.people.values()].find(x => x.norm === n);
    if (!p) { p = { id: uid(), name: raw.replace(/_/g, ' '), norm: n, created: nowISO() }; await S.db.put('people', p); S.people.set(p.id, p); }
    if (!ids.includes(p.id)) ids.push(p.id);
  }
  return ids;
}
function richText(text) {
  const frag = document.createDocumentFragment(); let last = 0;
  for (const m of text.matchAll(PERSON_RE)) {
    frag.append(text.slice(last, m.index));
    frag.append(h('span', { class: 'person' }, '@' + m[1].replace(/_/g, ' ')));
    last = m.index + m[0].length;
  }
  frag.append(text.slice(last)); return frag;
}

  };

async function mergeTag(src, dest) {
  const tagTrackers = S.trackers.filter(t => t.type === 'meals' || t.type === 'tags').map(t => t.id);
  const all = (await S.db.all('entries')).filter(e => tagTrackers.includes(e.trackerId));
  const changed = [];
  const rep = arr => { if (!Array.isArray(arr) || !arr.includes(src.id)) return arr; const o = arr.map(x => x === src.id ? dest.id : x); return [...new Set(o)]; };
  for (const e of all) {
    let touched = false;
    if (Array.isArray(e.value)) { const n = rep(e.value); if (n !== e.value) { e.value = n; touched = true; } }
    else if (e.value && typeof e.value === 'object') for (const k in e.value) { const n = rep(e.value[k]); if (n !== e.value[k]) { e.value[k] = n; touched = true; } }
    if (touched) changed.push(e);
  }
  await S.db.putMany('entries', changed);
  dest.aliases = [...new Set([...(dest.aliases || []), src.name, ...(src.aliases || [])])];
  dest.categories = [...new Set([...(dest.categories || []), ...(src.categories || [])])];
  await S.db.put('tags', dest); await S.db.del('tags', src.id); S.tags.delete(src.id);
  return changed.length;
}

/* PIN */
async function sha(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function pinPad(title, onDone, sub) {
  const el = h('div', { class: 'lock', role: 'dialog', 'aria-label': title });
  let pin = '';
  const dots = h('div', { class: 'pins', 'aria-hidden': 'true' });
  const draw = () => { dots.innerHTML = ''; for (let i = 0; i < 4; i++) dots.append(h('i', { class: i < pin.length ? 'f' : '' })); };
  const press = async d => {
    if (d === 'del') pin = pin.slice(0, -1); else if (pin.length < 4) pin += d;
    draw();
    if (pin.length === 4) { const ok = await onDone(pin, el); if (ok === false) { dots.classList.add('err'); setTimeout(() => { dots.classList.remove('err'); pin = ''; draw(); }, 400); } }
  };
  const keys = ['1','2','3','4','5','6','7','8','9','', '0', 'del'];
  el.append(h('h1', null, title), sub ? h('p', { class: 'note', style: 'text-align:center;max-width:300px' }, sub) : '', dots,
    h('div', { class: 'pad' }, keys.map(k => k === '' ? h('span') : h('button', { 'aria-label': k === 'del' ? 'Borrar' : k, onclick: () => press(k) }, k === 'del' ? '⌫' : k))));
  draw();
  document.body.append(el);
  const kb = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };
  document.addEventListener('keydown', kb);
  el._cleanup = () => document.removeEventListener('keydown', kb);
  return el;
}
function showLock() {
  return new Promise(res => {
    if (!S.meta.pinHash || $('.lock')) return res();
    const el = pinPad('Bujo', async pin => {
      if (await sha(S.meta.pinSalt + pin) === S.meta.pinHash) { el._cleanup(); el.remove(); S.unlocked = true; res(); return true; }
      return false;
    });
  });
}
function openPinSetup(after) {
  if (S.meta.pinHash) {
    openSheet('PIN', (b, close) => {

    });

function setNewPin(after) {
  if (!crypto.subtle) { toast('El PIN requiere HTTPS'); return; }
  let first = null;
  const el = pinPad('Nuevo PIN', async (pin, el) => {
    if (!first) { first = pin; el.querySelector('h1').textContent = 'Repite el PIN'; return false; }
    if (pin !== first) { first = null; el.querySelector('h1').textContent = 'No coincide. Nuevo PIN'; return false; }
    S.meta.pinSalt = uid(); S.meta.pinHash = await sha(S.meta.pinSalt + pin); await saveMeta();
    el._cleanup(); el.remove(); toast('PIN activado'); after(); return true;
  }, 'Si lo olvidas, solo podrás entrar borrando los datos de la app. Ten un backup.');
  el.append(h('button', { class: 'btn', onclick: () => { el._cleanup(); el.remove(); } }, 'Cancelar'));
}

async function shareOrDownload(blob, filename, title) {
  const file = new File([blob], filename, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; console.warn(e); }
  }
  const a = h('a', { href: URL.createObjectURL(blob), download: filename }); document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return true;
}

function csvCell(v) { if (v == null) return ''; const s = String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function exportCSV() {
  const d = await dumpAll();
  const tr = new Map(d.trackers.map(t => [t.id, t])); const tg = new Map(d.tags.map(t => [t.id, t.name]));
  const rows = [['fecha', 'origen', 'tracker_id', 'tracker', 'campo', 'valor', 'hora']];
  const push = (date, src, t, field, value, time) => rows.push([date, src, t?.id || '', t?.name || '', field, value, time || '']);
  for (const e of d.entries.sort((a, b) => a.date.localeCompare(b.date))) {
    const t = tr.get(e.trackerId), v = e.value;
    if (!t) { push(e.date, 'entry', { id: e.trackerId }, 'valor', JSON.stringify(v)); continue; }
    if (t.type === 'sleep') { push(e.date, 'entry', t, 'acostarse', v.bed); push(e.date, 'entry', t, 'levantarse', v.wake); const m = v.hoursOverride != null ? v.hoursOverride * 60 : sleepMinutes(v); push(e.date, 'entry', t, 'horas', m == null ? '' : (m / 60).toFixed(2)); push(e.date, 'entry', t, 'horas_corregidas', v.hoursOverride != null ? 'si' : 'no'); push(e.date, 'entry', t, 'calidad', v.quality); }
    else if (t.type === 'meals') for (const k in v) { if (v[k] === 'skip') push(e.date, 'entry', t, k, '(no comí)'); else (v[k] || []).forEach(id => push(e.date, 'entry', t, k, tg.get(id) || id)); }
    else if (t.type === 'tags') (v || []).forEach(id => push(e.date, 'entry', t, 'etiqueta', tg.get(id) || id));
    else if (t.type === 'multi') (v || []).forEach(o => push(e.date, 'entry', t, 'opcion', t.config.options.find(x => x.id === o)?.label || o));
    else if (t.type === 'checklist') for (const k in v) push(e.date, 'entry', t, t.config.options.find(x => x.id === k)?.label || k, v[k] ? 1 : 0);
    else if (t.type === 'bool') { push(e.date, 'entry', t, 'valor', v.v ? 1 : 0, v.time); for (const k in v) if (!['v', 'time'].includes(k) && v[k] != null) push(e.date, 'entry', t, k, v[k]); }
    else if (t.type === 'cycle') for (const k in v) push(e.date, 'entry', t, k, typeof v[k] === 'boolean' ? (v[k] ? 1 : 0) : v[k]);
    else if (t.type === 'list') push(e.date, 'entry', t, 'ninguna', 1);
    else push(e.date, 'entry', t, 'valor', v);
  }
  for (const e of d.events.sort((a, b) => a.date.localeCompare(b.date))) {
    const t = tr.get(e.trackerId);
    for (const k in e.attrs || {}) push(e.date, 'event', t, k, e.attrs[k], e.time);
  }
  for (const i of d.items) rows.push([i.date || '', 'item', '', i.collection || '', i.type, `[${i.status}] ${i.text}`, i.time || '']);
  const csv = '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\n');
  await shareOrDownload(new Blob([csv], { type: 'text/csv' }), `bujo-${S.demo ? 'demo-' : ''}datos-${todayStr()}.csv`, 'Datos Bujo (CSV)');
}
function validateBackup(b) {
  const errs = [];
  if (!b || typeof b !== 'object') return ['El archivo no es JSON válido.'];
  if (b.app !== 'bujo') errs.push('No es un backup de Bujo.');
  if (typeof b.schemaVersion !== 'number') errs.push('Falta la versión de esquema.');
  else if (b.schemaVersion > SCHEMA_VERSION) errs.push(`El backup es de una versión más nueva (esquema v${b.schemaVersion}). Actualiza la app primero.`);
  const d = b.data || {};
  for (const s of STORES) if (!Array.isArray(d[s])) errs.push(`Falta la colección «${s}».`);
  if (errs.length) return errs;
  const re = /^\d{4}-\d{2}-\d{2}$/;
  if (d.entries.some(e => !re.test(e.date) || !e.trackerId)) errs.push('Hay registros con fecha o tracker no válidos.');
  if (d.events.some(e => !e.id || !re.test(e.date))) errs.push('Hay entradas de lista no válidas.');
  if (!d.meta.find(m => m.key === 'app')) errs.push('Faltan los ajustes de la app.');
  if (!d.trackers.length) errs.push('El backup no contiene trackers.');
  return errs;
}
function importJSON() {
  const inp = h('input', { type: 'file', accept: '.json,application/json,text/plain', style: 'position:fixed;left:-9999px' });
  document.body.append(inp);
  inp.onchange = async () => {
    const f = inp.files[0]; inp.remove(); if (!f) return;
    let b; try { b = JSON.parse(await f.text()); } catch (e) { b = null; }
    const errs = validateBackup(b);
    openSheet('Importar backup', (body, close) => {
      if (errs.length) { body.append(h('div', { class: 'warnbox' }, h('b', null, 'No se puede importar. '), errs.join(' ')), h('button', { class: 'btn blk', onclick: close }, 'Cerrar')); return; }
      const d = b.data; const dates = d.entries.map(e => e.date).sort();
      body.append(h('dl', { class: 'kv' },
        h('dt', null, 'Archivo'), h('dd', null, f.name),
        h('dt', null, 'Exportado'), h('dd', null, fmtDT(b.exportedAt)),
        h('dt', null, 'Versión'), h('dd', null, `app ${b.appVersion || '?'} · esquema v${b.schemaVersion}`),
        h('dt', null, 'Rango'), h('dd', null, dates.length ? `${fmtShort(dates[0])} – ${fmtShort(dates[dates.length - 1])}` : 'sin registros'),
        h('dt', null, 'Días con datos'), h('dd', null, new Set(dates).size),
        h('dt', null, 'Registros'), h('dd', null, `${d.entries.length} valores · ${d.events.length} entradas de lista`),
        h('dt', null, 'Diario'), h('dd', null, `${d.items.length} tareas, eventos y notas`),
        h('dt', null, 'Etiquetas'), h('dd', null, `${d.tags.length} alimentos · ${d.people.length} personas`),
        h('dt', null, 'Trackers'), h('dd', null, d.trackers.length)),
        b.demo ? h('div', { class: 'warnbox' }, 'Este backup contiene datos demo.') : '',
        h('div', { class: 'warnbox' }, h('b', null, 'Se sobrescribirá todo '), `lo que hay ahora en ${S.demo ? 'la demo' : 'tus datos reales'}. El PIN no se importa.`),
        h('button', { class: 'btn blk', onclick: () => exportJSON() }, 'Exportar copia de lo actual antes'),
        h('button', { class: 'btn dan fill blk', onclick: async () => {
          try {
            let data = clone(d);
            if (b.schemaVersion < SCHEMA_VERSION) data = migrateData(data, b.schemaVersion);
            const keepPin = { pinHash: S.meta.pinHash, pinSalt: S.meta.pinSalt };
            data.meta = data.meta.map(m => m.key === 'app' ? { ...m, ...keepPin, schemaVersion: SCHEMA_VERSION } : m);
            await S.db.replaceAll(data);
            await openDB(S.demo); applyTheme(); await loadDay(S.date); close(); $('.full')?.remove(); render(); toast('Backup importado');
          } catch (e) { console.error(e); toast('Error al importar. No se ha modificado nada.'); }
        } }, 'Sobrescribir e importar'));
    });
  };
  inp.click();
}

async function seedDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const R = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const foods = { desayuno: ['Café', 'Tostada', 'Aceite', 'Tomate', 'Jamón', 'Porridge avena', 'Leche', 'Plátano', 'Yogur', 'Fruta'],
    comida: ['Arroz', 'Pollo', 'Lentejas', 'Garbanzos', 'Ensalada', 'Pasta', 'Ñoquis', 'Salmón', 'Calabacín', 'Huevos revueltos', 'Pan', 'Aguacate', 'Sushi'],
    cena: ['Pizza', 'Crema de calabaza', 'Gyozas', 'Tortilla', 'Queso', 'Ensalada', 'Hamburguesa', 'Aros de cebolla', 'Sopa', 'Pescado'],
    extras: ['Infusión', 'Higos', 'Sandía', 'Smoothie', 'Chocolate', 'Patatas fritas', 'Café', 'Picos'] };

    'Pasta': ['gluten'], 'Ñoquis': ['gluten'], 'Lentejas': ['legumbres'], 'Garbanzos': ['legumbres'], 'Hamburguesa': ['ultra'], 'Aros de cebolla': ['fritos', 'ultra'],
    'Patatas fritas': ['fritos', 'ultra'], 'Picos': ['gluten', 'ultra'], 'Gyozas': ['gluten'] };
  const tagIds = {};
  for (const m in foods) for (const f of foods[m]) if (!tagIds[f]) { const t = await ensureTag(f); t.categories = catMap[f] || []; await S.db.put('tags', t); tagIds[f] = t.id; }
  const today = todayStr(); const entries = [], events = [], items = [];
  let cycleStart = addDays(today, -R(3, 20)); const cyc = [];
  for (let s = cycleStart; s > addDays(today, -125); s = addDays(s, -R(26, 31))) cyc.push(s);
  const isPeriod = d => cyc.some(s => { const k = diffDays(d, s); return k >= 0 && k < 5; });
  let prevBloat = 0; let prevLegume = false;
  for (let i = 119; i >= 0; i--) {
    const d = addDays(today, -i); const E = (trackerId, value) => entries.push({ date: d, trackerId, value, updated: nowISO() });
    if (i > 0 && i < 3 && rnd() < .5) continue; // algunos días recientes vacíos
    const partial = i === 0; // hoy a medias, para ver el indicador
    const sleepM = R(330, 520), wakeM = R(7 * 60, 10 * 60 + 30), bedM = wakeM - sleepM;
    const hm = m => `${String(Math.floor(((m % 1440) + 1440) % 1440 / 60)).padStart(2, '0')}:${String(((m % 60) + 60) % 60).padStart(2, '0')}`;
    const q = Math.max(0, Math.min(5, Math.round((sleepM - 330) / 45) + R(-1, 1)));
    E('sleep', { bed: hm(bedM), wake: hm(wakeM), quality: q });
    const stress = Math.max(0, Math.min(5, R(1, 4) + (q < 2 ? 1 : 0)));
    E('stress', stress); E('mood', Math.max(1, Math.min(5, 3 + Math.round((q - 2.5) / 2) - (stress > 3 ? 1 : 0) + R(-1, 1))));
    const meal = {};
    for (const m of ['desayuno', 'comida', 'cena', 'extras']) {
      if (m === 'desayuno' && rnd() < .15) { meal[m] = 'skip'; continue; }
      const n = m === 'extras' ? R(0, 2) : R(1, 3); const s = new Set(); while (s.size < n) s.add(tagIds[pick(foods[m])]);
      if (s.size) meal[m] = [...s];
    }
    E('meals', meal);
    const legume = Object.values(meal).flat().some(id => [tagIds['Lentejas'], tagIds['Garbanzos'], tagIds['Pizza']].includes(id));
    const per = isPeriod(d);
    let bloat = (prevLegume && rnd() < .7) || (per && rnd() < .5) || rnd() < .12;
    const st = bloat ? (rnd() < .5 ? ['hinchado', 'gases'] : ['hinchado']) : rnd() < .7 ? ['bien'] : ['regular'];
    E('stomach', st); E('stomach_int', bloat ? R(2, 4) : st[0] === 'bien' ? 0 : 1);
    prevLegume = legume; prevBloat = bloat;
    const nb = R(0, 2);
    if (!nb) E('bowel', { none: true });
    for (let k = 0; k < nb; k++) events.push({ id: uid(), date: d, trackerId: 'bowel', time: rnd() < .5 ? hm(R(420, 1320)) : null, attrs: { bristol: bloat ? pick([2, 3, 5, 6]) : pick([3, 4, 4, 4, 5]) }, created: nowISO() });
    E('pill', { v: rnd() < .93, time: rnd() < .6 ? '09:' + String(R(0, 59)).padStart(2, '0') : null });
    E('cycle', per ? { period: true, flow: pick(['leve', 'medio', 'abundante']), pain: R(1, 4) } : { period: false, ...(rnd() < .2 ? { pain: R(0, 2) } : {}) });
    if (partial) continue;
    E('cigs', R(0, 8)); E('joints', rnd() < .4 ? R(1, 2) : 0); if (rnd() < .8) E('caffeine', R(1, 3)); if (rnd() < .2) E('alcohol', R(1, 3));
    E('skincare', { am: rnd() < .4, pm: rnd() < .6 });
    const ex = rnd() < .35; E('exercise', ex ? { v: true, tipo: pick(['Gym', 'Caminar', 'Pilates']), min: pick([30, 45, 60]) } : { v: false });
    E('breathing', { v: rnd() < .3 });
    E('water', R(3, 9));
    const sp = {}; ['b12', 'mg', 'lteanina', 'vitd', 'omega3', 'creatina'].forEach(k => sp[k] = rnd() < .75); E('supps', sp);
    if (rnd() < .15) E('sex', [pick(['sola', 'pareja'])]); else if (rnd() < .5) E('sex', ['no']);
  }
  const people = ['Ana', 'Leo', 'Nuria', 'Grupo_teatro'];
  const notes = ['Me he despertado muy cansada, sin energía', 'Comida con @Ana', 'Día tranquilo, he leído un rato', 'Paseo largo con @Leo', 'Me he encontrado bien todo el día', 'Cena en casa de @Nuria', 'Ensayo con @Grupo_teatro'];
  const tasks = ['Comprar fruta', 'Hacer comida para la semana', 'Recoger cuarto', 'Limpiar baño', 'Poner lavadora', 'Llamar al seguro', 'Pedir cita dentista'];
  for (let i = 20; i >= 0; i--) {
    const d = addDays(today, -i);
    const mk = (type, text, status = 'open', extra = {}) => items.push({ id: uid(), type, text, dateType: 'day', date: d, status, collection: null, time: null, people: [], trail: [], fields: {}, created: nowISO(), updated: nowISO(), order: items.length, ...extra });
    if (rnd() < .6) mk('note', pick(notes));
    for (let k = 0; k < R(0, 3); k++) mk('task', pick(tasks), i > 0 ? (rnd() < .8 ? 'done' : 'open') : 'open');
    if (dow(d) === 1 || dow(d) === 3) mk('event', 'Gym', 'open', { time: '19:00' });
    if (dow(d) === 2) mk('event', 'Ofi');
  }
  for (const it of items) it.people = await extractPeople(it.text);
  await S.db.putMany('entries', entries); await S.db.putMany('events', events); await S.db.putMany('items', items);
  people.forEach(() => {});
  await loadCycle();
}

/* ---------------- service worker y actualizaciones ---------------- */
let swReg = null;
async function registerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  try {
    swReg = await navigator.serviceWorker.register('sw.js');
    swReg.addEventListener('updatefound', () => {
      const nw = swReg.installing; nw?.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner();
      });
    });
    if (swReg.waiting && navigator.serviceWorker.controller) showUpdateBanner();
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
  } catch (e) { console.warn('SW', e); }
}
function showUpdateBanner() {
  const b = $('#banners'); if (!b || $('#updbanner')) return;
  b.prepend(h('div', { class: 'banner b-info', id: 'updbanner' }, h('span', { class: 't' }, 'Hay una versión nueva. Tus datos se mantienen.'),
    h('button', { onclick: applyUpdate }, 'Actualizar')));
}
function applyUpdate() {
  if (swReg?.waiting) swReg.waiting.postMessage({ type: 'SKIP_WAITING' }); else location.reload();
}
function getSWVersion() {
  return new Promise(res => {
    const c = navigator.serviceWorker?.controller; if (!c) return res(null);
    const ch = new MessageChannel(); ch.port1.onmessage = e => res(e.data?.version || null);
    c.postMessage({ type: 'GET_VERSION' }, [ch.port2]); setTimeout(() => res(null), 1500);
  });
}
async function checkUpdate() {
  if (!swReg) { toast('Sin service worker. Recargando…'); setTimeout(() => location.reload(), 600); return; }
  toast('Buscando actualización…');
  try { await swReg.update(); } catch (e) { toast('Sin conexión. Inténtalo más tarde.'); return; }
  if (swReg.waiting || swReg.installing) { toast('Actualización encontrada'); setTimeout(applyUpdate, 800); }
  else {
    // El HTML se sirve "red primero": recargar trae la última versión del index aunque el SW no cambie.
    try { const r = await fetch('./index.html', { cache: 'no-store' }); const t = await r.text(); const m = t.match(/APP_VERSION = '([^']+)'/);
      if (m && m[1] !== APP_VERSION) { toast(`Nueva versión ${m[1]}. Recargando…`); setTimeout(() => location.reload(), 900); }
      else toast(`Ya tienes la última versión (v${APP_VERSION})`);
    } catch (e) { toast('Sin conexión. Inténtalo más tarde.'); }
  }
}

let hiddenAt = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (S.meta?.pinHash && Date.now() - hiddenAt > 60000) await showLock();
  // Si cambia el día con la app abierta, ir a hoy
  if (hiddenAt && Date.now() - hiddenAt > 30 * 60000 && S.date !== todayStr()) goDate(todayStr());
});
async function boot() {
  let demo = false; try { demo = localStorage.getItem('bujo.demo') === '1'; } catch (e) {}
  try {
    await openDB(demo);
  } catch (e) {
    $('#app').append(h('div', { class: 'fatal' }, h('b', null, 'No se han podido abrir los datos. '), String(e?.message || e), h('br'), 'No borres la app: recarga o contacta para recuperar.'));
    return;
  }
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  await showLock();
  await loadDay(S.date);
  render();
  if (S.db.kind === 'idb' && navigator.storage?.persisted && !(await navigator.storage.persisted())) requestPersist();
  registerSW();
}
boot();
