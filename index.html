<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bujo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bujo">
<meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{--paper:#F5F2EB;--card:#FFFDF8;--line:#E6E0D4;--line2:#EEE8DD;--ink:#26231F;--muted:#7A7368;--faint:#A39B8E;--soft:#F3EFE7;--chip:#F1ECE2;--accent:oklch(0.48 0.12 260);--accent-soft:oklch(0.94 0.025 260);--dot:#DAD3C5;--tab:rgba(250,248,243,.9);--r:oklch(0.64 0.15 25);--b:oklch(0.62 0.11 255);--g:oklch(0.67 0.11 155);--evbg:0.92;--evfg:0.36;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#171614;--card:#211F1C;--line:#33302B;--line2:#2C2925;--ink:#EDE8DF;--muted:#9A9286;--faint:#7A7368;--soft:#2A2723;--chip:#2E2B27;--accent:oklch(0.78 0.1 260);--accent-soft:oklch(0.3 0.06 260);--dot:#2C2A26;--tab:rgba(23,22,20,.9);--evbg:0.32;--evfg:0.9;color-scheme:dark}}
:root[data-theme=dark]{--paper:#171614;--card:#211F1C;--line:#33302B;--line2:#2C2925;--ink:#EDE8DF;--muted:#9A9286;--faint:#7A7368;--soft:#2A2723;--chip:#2E2B27;--accent:oklch(0.78 0.1 260);--accent-soft:oklch(0.3 0.06 260);--dot:#2C2A26;--tab:rgba(23,22,20,.9);--evbg:0.32;--evfg:0.9;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.4px);background-size:18px 18px;background-attachment:fixed;color:var(--ink);font:15px/1.4 'DM Sans',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.mono{font-family:'DM Mono',ui-monospace,monospace}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px;gap:8px}
.kick{font:500 11px 'DM Mono',monospace;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.h1{font:600 30px/1.05 'DM Sans',sans-serif;letter-spacing:-.02em;margin:4px 0 0}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;position:relative;overflow:hidden}
.ib.bx{background:var(--card);border:1px solid var(--line)}
.ib input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 9px;border-radius:14px}
.wd .l{font:500 10px 'DM Mono';letter-spacing:.1em;opacity:.7}
.wd .n{font:600 17px 'DM Sans'}
.wd.sel{background:var(--ink);color:var(--paper)}
.wd.today:not(.sel) .n{color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;border:1.5px solid transparent;display:block}
.dot.c{background:currentColor;border-color:currentColor}.dot.i{border-color:currentColor}.dot.n{border-color:var(--line)}.dot.f{background:var(--accent);border-color:var(--accent)}
.wd.sel .dot.n{border-color:transparent}
.sh{display:flex;align-items:center;gap:8px;padding:0 4px;margin:26px 0 10px;min-height:24px}
.sh>i{font-size:18px}
.sh .t{font:500 11px 'DM Mono';letter-spacing:.32em;text-transform:uppercase}
.sh .r{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.lk{color:var(--accent);font-size:13px;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:14px}
.card.ls{padding:2px 14px;gap:0}
.lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
.fld{display:flex;flex-direction:column;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbox{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tbox input{border:0;background:transparent;font:500 24px 'DM Mono';padding:0;width:100%;min-height:36px;-webkit-appearance:none;appearance:none;text-align:left}
.tbox small{font-size:11px;color:var(--muted)}
.irow{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;border-radius:14px;background:var(--soft)}
.irow.hl{background:var(--card);border:1.5px solid var(--accent)}
.irow>i{font-size:20px}
.irow .tx{flex:1;font-size:14px}
.irow input{border:0;background:transparent;text-align:right;font:500 22px 'DM Mono';width:130px;padding:0;min-height:44px}
.irow input:focus{outline:none}
.irow small{font-size:13px;color:var(--muted)}
.rads{display:flex;gap:6px}
.rad{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:12px;background:var(--soft);border:1.5px solid transparent;font-size:13px}
.rad .o{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center}
.rad .o::after{content:'';width:12px;height:12px;border-radius:50%}
.rad.on{border-color:var(--c);font-weight:600}
.rad.on .o::after{background:var(--c)}
.rads.bare{justify-content:space-between;padding:0 4px}
.rads.bare .rad{flex:none;width:44px;min-height:52px;background:none;border:0;justify-content:flex-start;gap:5px;font:400 13px 'DM Mono'}
.faces{display:flex;justify-content:space-between}
.face{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--soft);color:var(--muted)}
.face.on{background:var(--c);color:#1E1C19}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;font-size:13.5px;background:var(--card);border:1px solid var(--line)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.sm{min-height:32px;padding:0 11px;font-size:13px}
.chip.tag{background:var(--chip);border-color:transparent;padding-right:6px}
.chip.tag .dn{display:inline-flex;align-items:center;gap:6px;min-height:32px}
.chip.tag .ni{display:inline-flex;align-items:center;gap:2px;font:500 11px 'DM Mono';color:var(--muted)}
.ingl{display:block;text-align:left;font-size:12px;line-height:1.4;color:var(--muted);text-wrap:pretty}.ingl b{color:var(--ink);font-weight:600}
.chip.tag .rm{width:22px;height:22px;display:grid;place-items:center;color:var(--faint);font-size:12px}
.chip.big{min-height:44px;border-radius:14px;padding:0 14px;font-size:14px}
.cdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.meal{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.meal:last-child{border-bottom:0}
.meal .mn{width:84px;flex:none;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;height:32px}
.meal .mn i{font-size:17px}
.meal .mb{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.tin{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 11px;font-size:16px;min-height:42px}
.tin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sug{display:flex;flex-wrap:wrap;gap:6px}.sug:empty{display:none}
.li{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .s{width:22px;text-align:center;font:500 17px 'DM Mono';flex:none}
.li .tx{flex:1;font-size:14.5px;min-width:0;padding:8px 0}
.li .tx small{display:block;font-size:11.5px;color:var(--muted)}
.li.done .tx,.li.done .s,.li.mig .tx,.li.mig .s{color:var(--faint)}
.li.done .tx{text-decoration:line-through}
.li .x{width:36px;height:36px;display:grid;place-items:center;color:var(--faint);font-size:16px;flex:none}
.li .main{flex:1;display:flex;align-items:center;gap:10px;min-height:44px;min-width:0}
.pill{font:500 11px 'DM Mono';padding:4px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent);flex:none;text-transform:uppercase}
.dpick{position:relative;display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;flex:none;overflow:hidden}
.dpick input{position:absolute;inset:0;opacity:0;width:100%}
.sub{font:500 10px 'DM Mono';letter-spacing:.28em;color:var(--muted);padding:12px 0 2px;text-transform:uppercase}
.sw{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(20px)}
.srow{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid var(--line2)}
.srow:last-child{border-bottom:0}
.srow>i{font-size:20px;flex:none}
.srow .tx{flex:1;display:flex;flex-direction:column;font-size:14px;min-width:0}
.srow .tx small{font-size:12px;color:var(--muted)}
.srow .vv{font-size:13px;color:var(--muted)}
.tinput{border:0;background:var(--soft);border-radius:8px;padding:6px 8px;font:400 14px 'DM Mono';color:var(--muted);min-height:34px}
.ninput{border:0;background:var(--soft);border-radius:8px;padding:6px 8px;font:400 15px 'DM Mono';width:76px;min-height:36px;text-align:right}
.cnts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cnt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cnt .nm{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.cnt .nm i{font-size:17px}
.cnt .ct{display:flex;align-items:center;justify-content:space-between}
.cnt .v{font:500 26px 'DM Mono'}
.cnt small{font-size:11.5px;color:var(--muted)}
.sq{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--soft)}
.sq.pri{background:var(--ink);color:var(--paper)}
.drops{display:flex;justify-content:space-between;flex-wrap:wrap}
.drop{width:38px;height:44px;display:grid;place-items:center;font-size:28px;color:oklch(0.6 0.1 220)}
.btn{min-height:44px;border-radius:12px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;border:1px solid var(--line);background:var(--card)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.btn.dan{color:var(--r)}
.btn.blk{width:100%}
.btn.sm{min-height:38px;padding:0 13px;font-size:13px}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.brow{display:flex;gap:8px}.brow .btn{flex:1}
.ev{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:14px;background:oklch(var(--evbg) 0.05 var(--h));color:oklch(var(--evfg) 0.11 var(--h));width:100%}
.ev i{font-size:18px}.ev .tx{flex:1;font-size:14px;font-weight:600}.ev .tm{font:500 13px 'DM Mono'}
.evs{display:flex;flex-direction:column;gap:6px}
.evc{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 11px;border-radius:999px;background:oklch(var(--evbg) 0.05 var(--h));color:oklch(var(--evfg) 0.11 var(--h));font-size:12.5px;font-weight:600}
.evc.big{min-height:52px;border-radius:14px;font-size:15px;padding:0 16px;width:100%}
.bt{width:64px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.bt img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.bopt{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 10px;border-radius:14px;background:var(--card);border:1.5px solid var(--line2);width:100%}
.bopt.on{border-color:var(--accent);background:var(--accent-soft)}
.bopt .tx{flex:1;display:flex;flex-direction:column}.bopt .tx b{font-size:14px}.bopt .tx small{font-size:12px;color:var(--muted)}
.hearts{display:flex;gap:8px}
.heart{flex:1;height:60px;border-radius:16px;border:1.5px solid oklch(0.88 0.06 22);background:oklch(0.95 0.03 22);color:oklch(0.52 0.17 22);display:grid;place-items:center;font-size:26px}
.heart.on{background:oklch(0.6 0.17 22);border-color:oklch(0.6 0.17 22);color:#fff}
.hh{position:relative;display:block;width:38px;height:28px}.hh i{position:absolute;font-size:24px}.hh i:first-child{left:0;top:3px}.hh i:last-child{left:13px;top:-1px}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--chip)}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:13.5px;color:var(--muted);text-align:center}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tab);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);z-index:20}
.tabs>div{display:flex;width:100%;max-width:520px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 10px 'DM Sans';color:var(--faint);min-height:48px;text-align:center}
.tabs button i{font-size:25px}
.tabs button.on{color:var(--accent);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(20,19,17,.42);z-index:50;display:flex;align-items:flex-end;animation:fi .2s}
.sheet{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:su .25s}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
.shd{display:flex;align-items:center;gap:8px;min-height:44px}
.shd b{flex:1;text-align:center;font-size:16px}
.shd button{color:var(--accent);font-size:15px;min-height:44px;min-width:70px}
.shd button:last-child{text-align:right;font-weight:600}
@keyframes su{from{transform:translateY(40px);opacity:.4}}
@keyframes fi{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:200;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal .hd{font:500 10px 'DM Mono';color:var(--muted);text-align:center;padding-bottom:4px}
.cd{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;font-size:14px;font-weight:500}
.cd.today{color:var(--accent)}.cd.sel{background:var(--chip)}
.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);padding-top:6px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.mrow{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid var(--line2);width:100%}
.mrow:last-child{border-bottom:0}
.mrow .main{flex:1;display:flex;align-items:center;gap:10px;min-height:40px;min-width:0}
.mrow .x{width:34px;height:34px;display:grid;place-items:center;color:var(--faint);font-size:15px;flex:none}
.mrow .dn{width:24px;text-align:right;font:500 14px 'DM Mono';flex:none}
.mrow .dw{width:14px;font:400 12px 'DM Mono';color:var(--muted);flex:none}
.mrow .tx{flex:1;font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 0;min-width:0}
.mrow .tx .e{display:inline-flex;align-items:center;gap:5px}
.mrow.we .dn,.mrow.we .dw{color:var(--accent)}
.futs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fut{background:var(--card);border-radius:16px;padding:10px 12px;min-height:58px;display:flex;flex-direction:column;gap:5px;border:1.5px solid var(--line)}
.fut.cur{border-color:var(--accent)}.fut.past{opacity:.6}
.fut .mn{font:500 10.5px 'DM Mono';letter-spacing:.3em}
.fb{display:flex;gap:5px;align-items:flex-start;padding:5px 7px;border-radius:9px;font-size:11.5px;line-height:1.3;background:oklch(var(--evbg) 0.05 var(--h));color:oklch(var(--evfg) 0.11 var(--h));font-weight:500;text-align:left;width:100%}
.fb b{font:600 11px 'DM Mono';flex:none}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.rate button{height:40px;border-radius:10px;background:var(--soft);font:500 14px 'DM Mono';text-align:center}.rate button.on{background:var(--ink);color:var(--paper)}
.seg button i{vertical-align:-2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);text-align:left;min-height:110px}
.col>i{font-size:24px}.col>b{font-size:14px;line-height:1.2}
.cc{display:flex;align-items:baseline;gap:6px;margin-top:auto}.cc b{font:500 22px 'DM Mono'}.cc span{font-size:11.5px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:8px;font:400 11px 'DM Mono';color:var(--muted)}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line2);overflow:hidden}.bar>div{height:100%;background:var(--ink)}
.bar.g>div{background:var(--g)}
.card.st{gap:10px;margin-bottom:8px}
.sth{display:flex;align-items:center;gap:10px}.sth>i{font-size:20px;flex:none}.sth .tx{flex:1;display:flex;flex-direction:column;font-size:14px;font-weight:600;min-width:0}.sth .tx small{font-size:11.5px;color:var(--muted);font-weight:400}
.sth .v{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}.sth .v b{font:500 19px 'DM Mono'}
.dl{font:500 11px 'DM Mono';color:var(--muted)}.dl.up{color:oklch(0.52 0.12 155)}.dl.dn{color:oklch(0.55 0.16 25)}
.stempty{height:70px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted)}.stempty i{font-size:16px}
.xl{position:relative;height:14px;margin-top:-4px}.xl span{position:absolute;transform:translateX(-50%);font:400 10px 'DM Mono';color:var(--muted);white-space:nowrap}
.xl span:first-child{transform:none}.xl span:last-child{transform:translateX(-100%)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:11.5px;color:var(--muted)}.kpi b{font:500 20px 'DM Mono'}.kpi small{font-size:11px;color:var(--muted)}
.summary{background:var(--ink);color:var(--paper);border-radius:18px;padding:14px;font-size:14px;line-height:1.5;text-wrap:pretty}
.chart{display:block;width:100%;height:auto}
.axis{display:flex;justify-content:space-between;font:400 10px 'DM Mono';color:var(--muted)}
.px{display:flex;flex-direction:column;gap:2px}.px .r{display:flex;align-items:center;gap:2px}.px .r>span{width:12px;font:400 8px 'DM Mono';color:var(--muted);flex:none}
.px .r i{flex:1;max-width:9px;height:8px;border-radius:2px;display:block;font-style:normal}
.wbar{display:flex;align-items:flex-end;gap:8px;height:90px}
.wbar>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:400 10px 'DM Mono';color:var(--muted)}
.wbar>div>i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent)}
.rk{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-bottom:1px solid var(--line2)}
.rk:last-child{border-bottom:0}
.rkh{display:flex;align-items:center;gap:8px}.rkh b{font-size:14.5px}.rkh small{font-size:11px;color:var(--muted)}.rkh .lift{margin-left:auto;font:500 16px 'DM Mono'}
.rkb{display:grid;grid-template-columns:72px 1fr 38px;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.rkb .mono{text-align:right}
.hb{height:6px;border-radius:3px;background:var(--chip)}.hb>div{height:100%;border-radius:3px;background:var(--ink)}.hb.l>div{background:var(--faint)}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tagm{font:400 10.5px 'DM Mono';padding:3px 7px;border-radius:6px;background:var(--chip)}
.rel-baja{background:oklch(0.93 0.04 30);color:oklch(0.4 0.1 30)}.rel-media{background:oklch(0.93 0.05 88);color:oklch(0.4 0.08 80)}.rel-alta{background:oklch(0.92 0.05 155);color:oklch(0.38 0.08 155)}
.warn{display:flex;gap:10px;padding:12px;border-radius:16px;background:oklch(0.93 0.05 70);color:oklch(0.36 0.08 60);margin-bottom:12px;align-items:flex-start}
.warn i{font-size:20px;flex:none}.warn>div{flex:1;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.4}
.warn .btn{align-self:flex-start;min-height:36px;background:#26231F;color:#F5F2EB;border:0;font-weight:600;font-size:13px}
.demo{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:13px;margin-bottom:12px}
.demo button{margin-left:auto;font-weight:600}
.info{display:flex;gap:8px;font-size:11.5px;line-height:1.4;color:var(--muted);padding:0 4px;margin-top:12px}
.info i{font-size:15px;flex:none}
.grp{font:500 11px 'DM Mono';letter-spacing:.32em;color:var(--muted);padding:18px 4px 8px;text-transform:uppercase}
.empty{font-size:13px;color:var(--muted);padding:12px 0}
.lock{position:fixed;inset:0;background:var(--paper);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px}
.lock h1{font:600 22px 'DM Sans';margin:0}
.pins{display:flex;gap:14px}.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}.pins i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}.pad button{height:72px;border-radius:50%;background:var(--card);border:1px solid var(--line);font:500 24px 'DM Mono';text-align:center}
.pad button:active{background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}.field>span{font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;width:100%}
dl.pv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}dl.pv dt{color:var(--muted)}dl.pv dd{margin:0;font-family:'DM Mono'}
</style>

function customField(t) {

async function prepDiario() {
  if (S.ui.dseg === 'm') {

    S.cache.m = { en, ev, it };

    const y = S.ui.year; S.cache.f = await S.db.range('items', 'date', `${y}-01-01`, `${y}-12-31`);

}

    for (let n = 1; n <= last; n++) {

      <div class="rkb" style="grid-template-columns:minmax(0,1.4fr) 1fr 64px"><span>${c.X.hiLong(c.th)}</span><div class="hb"><div style="width:${c.mH / mx * 100}%"></div></div><span class="mono">${c.Y.fmt(c.mH)}</span><span>${c.X.loLong(c.th)}</span><div class="hb l"><div style="width:${c.mL / mx * 100}%"></div></div><span class="mono">${c.Y.fmt(c.mL)}</span></div>
      <span style="font-size:12px;color:var(--muted)">${c.Y.what}${c.lag ? ' al día siguiente' : ' ese día'}</span>
      <div class="tags"><span class="tagm rel-${str[1]}">${str[0]}</span><span class="tagm rel-${relOf(c.n)}">${RELW[relOf(c.n)]}</span><span class="tagm">${c.nH} + ${c.nL} días</span></div></div>`;

  const hits = [...S.tags.values()].filter(t => t.norm.startsWith(q) || t.norm.includes(' ' + q)).slice(0, 6);
  box.innerHTML = hits.map(t => `<button class="chip sm" data-a="sugPick" data-m="${isIng ? '_ing' : el.dataset.m}" data-name="${esc(t.name)}" onmousedown="event.preventDefault()">${esc(t.name)}${tagDots(t)}</button>`).join('');
});

/* ---------- backup ---------- */
async function backupObject() { return { app: 'bujo', format: 1, schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, exportedAt: nowISO(), demo: S.demo, data: await dumpAll() }; }
async function shareOrDownload(blob, filename, title) {
  const file = new File([blob], filename, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title }); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return true;
}
async function exportJSON() {
  const b = await backupObject();
  const ok = await shareOrDownload(new Blob([JSON.stringify(b)], { type: 'application/json' }), `bujo-${S.demo ? 'demo-' : ''}backup-${todayStr()}.json`, 'Backup Bujo');
  if (ok) { S.meta.lastBackup = nowISO(); await saveMeta(); toast('Backup exportado'); await render(); }
}
const csvCell = v => { if (v == null) return ''; const s = String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
async function exportCSV() {
  const d = await dumpAll(), tr = new Map(d.trackers.map(t => [t.id, t])), tg = new Map(d.tags.map(t => [t.id, t.name]));
  const rows = [['fecha','tipo','tracker','campo','valor','hora']];
  for (const e of d.entries.sort((a, b) => a.date.localeCompare(b.date))) {
    const t = tr.get(e.trackerId), n = t?.name || e.trackerId, v = e.value;
    if (t?.type === 'meals') { for (const k in v) { if (k === '_ing') continue; (Array.isArray(v[k]) ? v[k] : [v[k]]).forEach(id => rows.push([e.date, 'registro', n, k, tg.get(id) || id, ''])); } for (const k in (v._ing || {})) for (const dish in v._ing[k]) v._ing[k][dish].forEach(id => rows.push([e.date, 'ingrediente', n, `${k} · ${tg.get(dish) || dish}`, tg.get(id) || id, ''])); }
    else if (Array.isArray(v)) v.forEach(x => rows.push([e.date, 'registro', n, 'opción', x, '']));
    else if (v && typeof v === 'object') for (const k in v) rows.push([e.date, 'registro', n, k, v[k] === true ? 'sí' : v[k] === false ? 'no' : v[k], '']);
    else rows.push([e.date, 'registro', n, 'valor', v, '']);
  }
  for (const e of d.events) rows.push([e.date, 'evento', tr.get(e.trackerId)?.name || e.trackerId, 'bristol', e.attrs?.bristol ?? e.attrs?.text ?? '', e.time || '']);
  for (const i of d.items) rows.push([i.date || '', i.type, i.collection || '', i.status, i.text, i.time || '']);
  const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(';')).join('\n');
  await shareOrDownload(new Blob([csv], { type: 'text/csv' }), `bujo-${S.demo ? 'demo-' : ''}datos-${todayStr()}.csv`, 'Datos Bujo (CSV)');
}
function validateBackup(b) {
  const errs = [];
  if (!b || typeof b !== 'object') return ['El archivo no es JSON válido.'];
  if (b.app !== 'bujo') errs.push('No es un backup de Bujo.');
  if (typeof b.schemaVersion !== 'number') errs.push('Falta la versión de esquema.');
  else if (b.schemaVersion > SCHEMA_VERSION) errs.push(`El backup es de una versión más nueva (esquema v${b.schemaVersion}). Actualiza la app primero.`);
  if (!b.data || typeof b.data !== 'object') errs.push('Faltan los datos.');
  else for (const s of ['meta','trackers','entries']) if (!Array.isArray(b.data[s])) errs.push(`Falta la tabla «${s}».`);
  return errs;
}
function importJSON() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json,text/plain'; inp.style.cssText = 'position:fixed;left:-9999px';
  inp.onchange = async () => {
    const f = inp.files[0]; inp.remove(); if (!f) return;
    let b; try { b = JSON.parse(await f.text()); } catch (e) { toast('No se puede leer el archivo'); return; }
    const errs = validateBackup(b);
    if (errs.length) { openSheet('Backup no válido', `<div class="card">${errs.map(x => `<p style="margin:0">${esc(x)}</p>`).join('')}</div>`); return; }
    const days = new Set(b.data.entries.map(e => e.date)).size;
    openSheet('Importar backup', `<dl class="pv"><dt>Exportado</dt><dd>${esc(new Date(b.exportedAt).toLocaleString('es-ES', { timeZone: TZ }))}</dd><dt>Versión</dt><dd>app ${esc(b.appVersion || '?')} · esquema v${b.schemaVersion}</dd><dt>Días</dt><dd>${days}</dd><dt>Registros</dt><dd>${b.data.entries.length}</dd><dt>Tareas/notas</dt><dd>${(b.data.items || []).length}</dd><dt>Etiquetas</dt><dd>${(b.data.tags || []).length}</dd>${b.demo ? '<dt>Ojo</dt><dd>es un backup DEMO</dd>' : ''}</dl>
      <div class="warn" style="margin:0"><i class="ph-light ph-warning"></i><div>Se <b>sustituirán</b> todos los datos actuales${S.demo ? ' del modo demo' : ''}. Si no tienes backup de lo actual, cancela y exporta primero.</div></div>`, 'Sobrescribir', async () => {
      let data = b.data; if (b.schemaVersion < SCHEMA_VERSION) data = migrateData(data, b.schemaVersion);
      const keep = { pinHash: S.meta.pinHash, pinSalt: S.meta.pinSalt };
      data.meta = (data.meta || []).map(m => m.key === 'app' ? { ...m, ...keep, schemaVersion: SCHEMA_VERSION } : m);
      await S.db.replaceAll(data); await openDB(S.demo); toast('Backup importado');
    });
  };
  document.body.append(inp); inp.click();
}

/* ---------- PIN ---------- */
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function pinPad(title, onPin, note) {
  const el = document.createElement('div'); el.className = 'lock'; let pin = '';
  const draw = () => { el.innerHTML = `<i class="ph-light ph-lock-simple" style="font-size:34px"></i><h1>${title}</h1><div class="pins">${[0,1,2,3].map(i => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}" aria-label="${k === '⌫' ? 'Borrar' : k}">${k}</button>`).join('')}</div>${note ? `<p class="info" style="max-width:280px;text-align:center">${note}</p>` : ''}`; };
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-k]'); if (!b) return; e.stopPropagation();
    if (b.dataset.k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += b.dataset.k;
    draw();
    if (pin.length === 4) { const r = await onPin(pin, t => { title = t; }); if (r) el.remove(); else { pin = ''; setTimeout(draw, 150); } }
  });
  draw(); document.body.append(el); return el;
}
function showLock() {
  return new Promise(res => {
    if (!S.meta.pinHash || $('.lock')) return res();
    pinPad('Introduce el PIN', async pin => { if (await sha(S.meta.pinSalt + pin) === S.meta.pinHash) { res(); return true; } toast('PIN incorrecto'); return false; });
  });
}
function setNewPin() {
  let first = null;
  const el = pinPad('Nuevo PIN', async (pin, setT) => {
    if (!first) { first = pin; el.querySelector('h1').textContent = 'Repite el PIN'; setT('Repite el PIN'); return false; }
    if (pin !== first) { first = null; setT('No coincide. Nuevo PIN'); return false; }
    S.meta.pinSalt = uid(); S.meta.pinHash = await sha(S.meta.pinSalt + pin); await saveMeta(); toast('PIN activado'); await render(); return true;
  }, 'Si lo olvidas, solo podrás entrar borrando los datos de la app. Ten un backup.');
  el.insertAdjacentHTML('beforeend', '<button class="btn" style="position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:16px" onclick="this.parentNode.remove()">Cancelar</button>');
}

/* ---------- tema, SW, actualización ---------- */
function applyTheme() {
  const t = S.meta?.theme || 'system'; if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
  const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name=theme-color]').forEach(m => m.setAttribute('content', dark ? '#171614' : '#F5F2EB'));
}
async function registerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  try {
    S.swReg = await navigator.serviceWorker.register('sw.js');
    S.swReg.addEventListener('updatefound', () => { const nw = S.swReg.installing; nw?.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(); }); });
    if (S.swReg.waiting && navigator.serviceWorker.controller) showUpdate();
    let reloading = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
  } catch (e) { console.warn('SW', e); }
}
function showUpdate() {
  openSheet('Hay una versión nueva', `<p style="margin:0;font-size:14px;line-height:1.5">Antes de actualizar, exporta un backup. Tus datos no se borran al actualizar.</p><button class="btn blk" data-a="export"><i class="ph-light ph-export"></i>Exportar backup</button>`, 'Actualizar', async () => {
    if (S.swReg?.waiting) S.swReg.waiting.postMessage({ type: 'SKIP_WAITING' }); else location.reload(); return false;
  });
}
async function checkUpdate(manual) {
  try {
    await S.swReg?.update();
    if (S.swReg?.waiting) { showUpdate(); return; }
    const r = await fetch('./index.html', { cache: 'no-store' }); const t = await r.text(); const m = t.match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) { toast(`Nueva versión ${m[1]}. Recargando…`); setTimeout(() => location.reload(), 900); }
    else if (manual) toast(`Ya tienes la última versión (v${APP_VERSION})`);
  } catch (e) { if (manual) toast('Sin conexión: no se puede comprobar'); }
}
